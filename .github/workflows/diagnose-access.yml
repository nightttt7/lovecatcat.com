name: Diagnose production access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'nightttt7/lovecatcat.com'
    runs-on: ubuntu-latest
    steps:
      - name: Capture response headers and body
        run: |
          echo "=== runner egress info ==="
          curl --silent --show-error --max-time 20 https://www.cloudflare.com/cdn-cgi/trace || true
          echo "=== curl default headers ==="
          curl --silent --show-error --max-time 20 --dump-header - --output /tmp/body-default https://lovecatcat.com/ | head -30
          echo "--- body (first 600 chars) ---"
          head -c 600 /tmp/body-default
          echo
          echo "=== curl browser user-agent ==="
          curl --silent --show-error --max-time 20 --output /dev/null \
            --write-out 'status=%{http_code}\n' \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' \
            https://lovecatcat.com/
          echo "=== node fetch default ==="
          node --input-type=module <<'NODE'
          const response = await fetch('https://lovecatcat.com/', { signal: AbortSignal.timeout(15000) });
          console.log('status', response.status);
          for (const [key, value] of response.headers) console.log(`${key}: ${value}`);
          const body = await response.text();
          console.log('body:', body.slice(0, 600).replace(/\s+/g, ' '));
          NODE
          echo "=== node fetch browser user-agent ==="
          node --input-type=module <<'NODE'
          const response = await fetch('https://lovecatcat.com/', {
            headers: {
              'user-agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
              accept: 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'accept-language': 'en-US,en;q=0.9',
            },
            signal: AbortSignal.timeout(15000),
          });
          console.log('status', response.status);
          const body = await response.text();
          console.log('body:', body.slice(0, 300).replace(/\s+/g, ' '));
          NODE
